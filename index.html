<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Roasters Sort 〜極上やり込みパズル〜</title>
  <style>
    :root {
      --bg-color: #f7f2e7;
      --border-dark: #2c1a12;
      --ad-height: 100px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg-color);
      color: #2c1a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 20px calc(var(--ad-height) + 30px) 20px;
      position: relative;
    }

    /* Header & Title */
    .title-area {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 12px;
    }
    .title-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .title-text {
      font-size: 32px;
      font-weight: 900;
      color: #3d1e11;
      letter-spacing: -0.5px;
    }
    .sub-title {
      font-size: 14px;
      font-weight: bold;
      color: #4a3328;
      margin-top: 2px;
    }

    /* Sound Controls */
    .audio-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      width: 100%;
      justify-content: center;
    }
    .audio-btn {
      background: #ffffff;
      border: 2.5px solid var(--border-dark);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 800;
      color: #2c1a12;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border-dark);
    }
    .audio-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border-dark);
    }

    /* Menu Buttons */
    .menu-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-roaster {
      width: 100%;
      padding: 12px 16px;
      border: 3px solid var(--border-dark);
      border-radius: 25px;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--border-dark);
      transition: transform 0.05s, box-shadow 0.05s;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
    .btn-roaster:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--border-dark);
    }

    /* 各ボタンの個性的カラー */
    .btn-continue { background: linear-gradient(to bottom, #d2642a, #b34a17); color: #fff; }
    .btn-stage { background: #ffffff; color: #2c1a12; text-shadow: none; }
    .btn-daily { background: linear-gradient(to bottom, #509e53, #3b7e3e); color: #fff; }
    .btn-time { background: linear-gradient(to bottom, #c05826, #a14115); color: #fff; }
    .btn-shop { background: linear-gradient(to bottom, #8a48a9, #6a3285); color: #fff; }
    .btn-stats { background: linear-gradient(to bottom, #3b9b85, #277765); color: #fff; }
    .btn-achieve { background: #ffffff; color: #2c1a12; text-shadow: none; }
    .btn-bonus { background: linear-gradient(to bottom, #5bb376, #3f8e57); color: #fff; }
    .btn-help { background: #ffffff; color: #b33924; text-shadow: none; }

    /* 各画面切り替え */
    .screen { display: none; width: 100%; flex-direction: column; align-items: center; }
    .screen.active { display: flex; }

    /* パズル画面 */
    .game-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-weight: bold;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .bottles-area {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0 20px 0;
      width: 100%;
      min-height: 180px;
    }
    .bottle {
      width: 46px;
      height: 150px;
      border: 3px solid var(--border-dark);
      border-radius: 0 0 16px 16px;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      padding: 3px;
      background: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .bottle.selected {
      border-color: #f39c12;
      transform: translateY(-10px);
    }
    .bean-item {
      width: 36px;
      height: 32px;
      border-radius: 50%;
      margin: 1px 0;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3);
    }

    /* 1500ステージ選択表示 */
    .stage-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .stage-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-height: 380px;
      overflow-y: auto;
      padding: 10px;
      background: #ffffff;
      border-radius: 16px;
      border: 3px solid var(--border-dark);
      margin-bottom: 16px;
    }
    .stage-btn {
      aspect-ratio: 1;
      background: #f7f2e7;
      border: 2px solid var(--border-dark);
      border-radius: 10px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2c1a12;
      box-shadow: 0 2px 0 var(--border-dark);
    }
    .stage-btn.cleared {
      background: #509e53;
      color: #ffffff;
    }
    .stage-btn.hard {
      border-color: #b33924;
    }

    /* 広告枠固定表示 */
    .ad-placeholder {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      height: var(--ad-height);
      background: #ffffff;
      border-top: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      overflow: hidden;
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- ホーム画面 -->
  <div id="screen-home" class="screen active">
    <div class="title-area">
      <div class="title-logo">
        <span style="font-size:28px;">☕</span>
        <span class="title-text">Roasters Sort</span>
      </div>
      <div class="sub-title">〜極上やり込みパズル〜</div>
    </div>

    <div class="audio-controls">
      <button class="audio-btn" onclick="toggleSE()" id="btn-se">🔊 SE: ON</button>
      <button class="audio-btn" onclick="toggleBGM()" id="btn-bgm">🎵 BGM: OFF</button>
    </div>

    <div class="menu-list">
      <button class="btn-roaster btn-continue" onclick="continueGame()">▶ 続きから遊ぶ</button>
      <button class="btn-roaster btn-stage" onclick="openStageSelect()">🧃 ステージ選択 (1-1500)</button>
      <button class="btn-roaster btn-daily" onclick="alert('日替わりチャレンジへ')">📅 日替わりチャレンジ (🌕 150)</button>
      <button class="btn-roaster btn-time" onclick="alert('タイムアタックへ')">⏱️ タイムアタック (3分)</button>
      <button class="btn-roaster btn-shop" onclick="showScreen('screen-shop')">🎨 ショップ・着せ替え</button>
      <button class="btn-roaster btn-stats" onclick="showScreen('screen-stats')">📊 プレイ記録・統計</button>
      <button class="btn-roaster btn-achieve" onclick="alert('実績・アチーブメント')">🎖️ 実績・アチーブメント</button>
      <button class="btn-roaster btn-bonus" onclick="alert('デイリーボーナスを受け取りました！')">🎁 デイリーボーナス</button>
      <button class="btn-roaster btn-help" onclick="alert('遊び方：同じ色のコーヒー豆を瓶にそろえよう！')">❓ 遊び方（チュートリアル）</button>
    </div>
  </div>

  <!-- ステージ選択画面 -->
  <div id="screen-stage" class="screen">
    <div class="stage-title">🧃 ステージ選択 (1-1500)</div>
    <div class="stage-grid" id="stage-grid"></div>
    <div class="menu-list">
      <button class="btn-roaster btn-continue" onclick="showScreen('screen-home')">ホームへ戻る</button>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <span id="stage-num">Stage 1</span>
      <span id="move-num">手数: 0</span>
    </div>
    <div class="bottles-area" id="bottles-area"></div>
    <div class="menu-list" style="margin-top: 10px;">
      <button class="btn-roaster btn-continue" onclick="resetStage()">リセット</button>
      <button class="btn-roaster btn-stage" onclick="showScreen('screen-home')">ホームへ戻る</button>
    </div>
  </div>

  <!-- ショップ画面 -->
  <div id="screen-shop" class="screen">
    <h2 style="margin-bottom: 20px;">🎨 ショップ・着せ替え</h2>
    <div class="menu-list">
      <button class="btn-roaster btn-continue" onclick="showScreen('screen-home')">戻る</button>
    </div>
  </div>

  <!-- 統計画面 -->
  <div id="screen-stats" class="screen">
    <h2 style="margin-bottom: 20px;">📊 プレイ記録・統計</h2>
    <div id="stats-info" style="margin-bottom: 20px; font-weight: bold; text-align: center; line-height: 1.8;"></div>
    <div class="menu-list">
      <button class="btn-roaster btn-continue" onclick="showScreen('screen-home')">戻る</button>
    </div>
  </div>

</div>

<!-- 下部固定広告領域 -->
<div class="ad-placeholder">
  <!-- admax -->
  <script src="https://adm.shinobi.jp/s/5235ee24a3bda74d9a1d05e10baf3d94"></script>
  <!-- admax -->
</div>

<script>
  let seOn = true;
  let bgmOn = false;

  function toggleSE() {
    seOn = !seOn;
    document.getElementById('btn-se').innerText = `🔊 SE: ${seOn ? 'ON' : 'OFF'}`;
  }

  function toggleBGM() {
    bgmOn = !bgmOn;
    document.getElementById('btn-bgm').innerText = `🎵 BGM: ${bgmOn ? 'ON' : 'OFF'}`;
  }

  let currentStage = parseInt(localStorage.getItem('rs_currentStage')) || 1;
  let clearedStages = JSON.parse(localStorage.getItem('rs_clearedStages')) || [];

  let moveCount = 0;
  let bottles = [];
  // 難易度増加に伴いカラーパレットを拡張 (最大7色)
  const colors = ['#5c3d2e', '#c19a6b', '#8b5a2b', '#d2b48c', '#e67e22', '#e74c3c', '#9b59b6'];
  let selected = null;

  function saveData() {
    localStorage.setItem('rs_currentStage', currentStage);
    localStorage.setItem('rs_clearedStages', JSON.stringify(clearedStages));
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'screen-stats') {
      document.getElementById('stats-info').innerText = `最高到達ステージ: ${currentStage}\nクリア数: ${clearedStages.length} / 1500`;
    }
  }

  function continueGame() {
    startStage(currentStage);
  }

  function openStageSelect() {
    const grid = document.getElementById('stage-grid');
    grid.innerHTML = '';
    const fragment = document.createDocumentFragment();

    for (let i = 1; i <= 1500; i++) {
      const btn = document.createElement('button');
      btn.className = `stage-btn ${clearedStages.includes(i) ? 'cleared' : ''} ${i >= 570 ? 'hard' : ''}`;
      btn.innerText = i;
      btn.onclick = () => startStage(i);
      fragment.appendChild(btn);
    }
    grid.appendChild(fragment);
    showScreen('screen-stage');

    setTimeout(() => {
      const targetBtn = grid.children[currentStage - 1];
      if (targetBtn) {
        targetBtn.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }, 100);
  }

  // シード付き疑似乱数（ステージごとの配置再現用）
  function pseudoRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }

  function generateStage(stageNum) {
    let colorCount, emptyBottles;

    // 570ステージ以降は激高難易度化！
    if (stageNum >= 570) {
      colorCount = Math.min(7, 4 + Math.floor((stageNum - 570) / 150) + 1); // 最大7色
      emptyBottles = 1; // 空きボトルを1本に制限して難易度UP
    } else {
      colorCount = Math.min(5, 2 + Math.floor(stageNum / 150)); // 通常2〜4色
      emptyBottles = 2; // 空きボトル2本
    }

    let allBeans = [];
    for (let c = 0; c < colorCount; c++) {
      for (let i = 0; i < 4; i++) {
        allBeans.push(c);
      }
    }

    // ステージ番号に応じたシャッフル
    let seed = stageNum * 999;
    for (let i = allBeans.length - 1; i > 0; i--) {
      const j = Math.floor(pseudoRandom(seed++) * (i + 1));
      [allBeans[i], allBeans[j]] = [allBeans[j], allBeans[i]];
    }

    let resultBottles = [];
    for (let i = 0; i < colorCount; i++) {
      resultBottles.push(allBeans.slice(i * 4, (i + 1) * 4));
    }
    for (let i = 0; i < emptyBottles; i++) {
      resultBottles.push([]);
    }

    return resultBottles;
  }

  function startStage(stageNum) {
    currentStage = stageNum;
    moveCount = 0;
    saveData();

    bottles = generateStage(currentStage);
    selected = null;

    const stageLabel = currentStage >= 570 ? `Stage ${currentStage} 🔥` : `Stage ${currentStage}`;
    document.getElementById('stage-num').innerText = stageLabel;
    document.getElementById('move-num').innerText = `手数: ${moveCount}`;

    renderBottles();
    showScreen('screen-game');
  }

  function resetStage() {
    startStage(currentStage);
  }

  function renderBottles() {
    const area = document.getElementById('bottles-area');
    area.innerHTML = '';
    bottles.forEach((b, idx) => {
      const bEl = document.createElement('div');
      bEl.className = `bottle ${selected === idx ? 'selected' : ''}`;
      bEl.onclick = () => onBottleClick(idx);
      b.forEach(cIdx => {
        const bean = document.createElement('div');
        bean.className = 'bean-item';
        bean.style.backgroundColor = colors[cIdx];
        bEl.appendChild(bean);
      });
      area.appendChild(bEl);
    });
  }

  function onBottleClick(idx) {
    if (selected === null) {
      if (bottles[idx].length > 0) selected = idx;
    } else {
      if (selected !== idx) {
        const src = bottles[selected];
        const dest = bottles[idx];
        if (dest.length < 4 && (dest.length === 0 || dest[dest.length - 1] === src[src.length - 1])) {
          dest.push(src.pop());
          moveCount++;
          document.getElementById('move-num').innerText = `手数: ${moveCount}`;
          checkClear();
        }
      }
      selected = null;
    }
    renderBottles();
  }

  function checkClear() {
    let isClear = true;
    bottles.forEach(b => {
      if (b.length > 0) {
        if (b.length !== 4) isClear = false;
        else if (!b.every(val => val === b[0])) isClear = false;
      }
    });

    if (isClear) {
      setTimeout(() => {
        alert(`Stage ${currentStage} クリア！`);
        if (!clearedStages.includes(currentStage)) {
          clearedStages.push(currentStage);
        }
        currentStage++;
        saveData();
        startStage(currentStage);
      }, 150);
    }
  }
</script>
</body>
</html>
