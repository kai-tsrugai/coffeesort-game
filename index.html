<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Roasters Sort - 1500 Stages & Challenge</title>
  <style>
    :root {
      --bg-color: #f7f0e6;
      --card-bg: #fff8f0;
      --primary-color: #4a2c11;
      --accent-color: #e06d28;
      --text-color: #2b1810;
      --ad-height: 60px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 480px;
      height: calc(100vh - var(--ad-height));
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .screen.active {
      display: flex;
    }

    /* --- 1. ホーム画面 --- */
    #home-screen {
      justify-content: flex-start;
      padding: 20px 15px 30px 15px;
      text-align: center;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .title-logo {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--primary-color);
      margin-top: 10px;
      margin-bottom: 5px;
      text-shadow: 2px 2px 0px #e06d28;
      flex-shrink: 0;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 20px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .home-btn {
      width: 85%;
      max-width: 300px;
      padding: 14px;
      margin: 6px 0;
      font-size: 1.05rem;
      font-weight: bold;
      border: 3px solid var(--primary-color);
      border-radius: 30px;
      background: var(--accent-color);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--primary-color);
      transition: transform 0.1s;
      flex-shrink: 0;
    }

    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--primary-color);
    }

    .home-btn.secondary { background: #fff; color: var(--primary-color); }
    .home-btn.bonus { background: #27ae60; }
    .home-btn.timeattack { background: #d35400; }

    /* --- 2. ステージ選択画面 --- */
    #select-screen, #achieve-screen {
      padding: 15px 15px 10px 15px;
      height: calc(100vh - var(--ad-height));
    }

    .screen-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      margin-bottom: 10px;
      border-bottom: 2px solid var(--primary-color);
      flex-shrink: 0;
    }

    .back-btn {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .stage-grid-container {
      width: 100%;
      flex: 1;
      height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 20px;
    }

    .stage-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 5px;
    }

    .stage-card {
      aspect-ratio: 1;
      background: #fff;
      border: 2px solid var(--primary-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--primary-color);
      position: relative;
    }

    .stage-card.cleared::after {
      content: '✓';
      position: absolute;
      top: 2px;
      right: 6px;
      color: #27ae60;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .stage-card.hard {
      border-color: #c0392b;
      color: #c0392b;
      background: #fff0f0;
    }

    .stage-card.locked {
      background: #dcdde1;
      border-color: #7f8c8d;
      color: #7f8c8d;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* --- アチーブメントリスト --- */
    .achieve-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }

    .achieve-item {
      background: #fff;
      border: 2px solid var(--primary-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .achieve-claim-btn {
      background: #27ae60;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .achieve-claim-btn.done {
      background: #7f8c8d;
      cursor: default;
    }

    /* --- 3. パズルゲーム画面 --- */
    #game-screen {
      justify-content: flex-start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    header {
      width: 100%;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #5c3a21, #3d2314);
      color: #fff;
      flex-shrink: 0;
    }

    .coin-display {
      background: #e06d28;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .timer-display {
      background: #c0392b;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .difficulty-badge {
      font-size: 0.75rem;
      background: #e74c3c;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }

    /* ショップボタン */
    .shop-container {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 8px 6px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.75);
      border-bottom: 2px solid rgba(92, 58, 33, 0.2);
    }

    .shop-btn {
      background: #fff;
      border: 2px solid #5c3a21;
      border-radius: 10px;
      padding: 6px 2px;
      font-size: 0.65rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      box-shadow: 0 3px 0 #5c3a21;
    }

    .shop-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #5c3a21;
    }

    .game-board {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: flex-start;
      gap: 12px 10px;
      width: 100%;
      padding: 20px 10px 75px 10px;
      box-sizing: border-box;
    }

    .bottle {
      width: 50px;
      height: 165px;
      border: 3px solid #5c3a21;
      border-radius: 0 0 16px 16px;
      background: rgba(255,255,255,0.85);
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      padding: 3px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
    }

    .bottle.selected {
      transform: translateY(-16px);
      border-color: #e06d28;
      box-shadow: 0 8px 20px rgba(224, 109, 40, 0.4);
    }

    .bottle.locked-bottle {
      background: #bdc3c7;
      border-color: #7f8c8d;
    }

    .bottle.locked-bottle::after {
      content: '🔒';
      font-size: 1.3rem;
      position: absolute;
      top: 40%;
    }

    .bean {
      width: 100%;
      height: 36px;
      border-radius: 8px;
      margin-top: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #fff;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -3px 4px rgba(0,0,0,0.3);
    }

    .bean-light  { background: linear-gradient(135deg, #e6b88a, #c48b52); }
    .bean-medium { background: linear-gradient(135deg, #b87333, #8a4f1d); }
    .bean-dark   { background: linear-gradient(135deg, #5a3825, #2b1810); }
    .bean-matcha { background: linear-gradient(135deg, #8ba832, #556b14); }
    .bean-berry  { background: linear-gradient(135deg, #d9534f, #962d2a); }
    .bean-milk   { background: linear-gradient(135deg, #f5ebe0, #d5bdaf); color: #333; }

    .bean.blind { background: #7f8c8d !important; }
    .bean.blind::after { content: '❓'; }

    .bean.frozen { border: 2px solid #00d2d3; box-shadow: 0 0 8px #00d2d3; }
    .bean.frozen::after { content: '❄️'; }

    /* 忍者AdMax 常駐広告 */
    .fixed-bottom-ad {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      height: var(--ad-height);
      background-color: #f0f0f0;
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
      border-top: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <!-- 1. ホーム画面 -->
  <div id="home-screen" class="screen active">
    <div class="title-logo">☕ Roasters Sort</div>
    <div class="subtitle">〜やり込みパズル〜</div>
    
    <button class="home-btn" onclick="continueGame()">▶ 続きから遊ぶ</button>
    <button class="home-btn secondary" onclick="showScreen('select-screen')">🗺️ ステージ選択 (1-1500)</button>
    <button class="home-btn bonus" onclick="startDailyChallenge()">📅 日替わりチャレンジ (🪙150)</button>
    <button class="home-btn timeattack" onclick="startTimeAttack()">⏱️ タイムアタック (3分)</button>
    <button class="home-btn secondary" onclick="showScreen('achieve-screen')">🎖️ 実績・アチーブメント</button>
    <button class="home-btn bonus" onclick="claimDailyBonus()">🎁 デイリーボーナス</button>
  </div>

  <!-- 2. ステージ選択画面 -->
  <div id="select-screen" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="showScreen('home-screen')">🏠 ホーム</button>
      <h2 style="font-size: 1.1rem;">ステージ選択 (1-1500)</h2>
      <div style="width: 50px;"></div>
    </div>
    <div class="stage-grid-container">
      <div class="stage-grid" id="stage-grid"></div>
    </div>
  </div>

  <!-- アチーブメント画面 -->
  <div id="achieve-screen" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="showScreen('home-screen')">🏠 ホーム</button>
      <h2 style="font-size: 1.1rem;">実績・アチーブメント</h2>
      <div style="width: 50px;"></div>
    </div>
    <div class="achieve-list" id="achieve-list"></div>
  </div>

  <!-- 3. パズルゲーム画面 -->
  <div id="game-screen" class="screen">
    <header>
      <button class="back-btn" onclick="exitGame()">🏠 戻る</button>
      <div style="font-weight:bold;">
        <span id="stage-label">STAGE</span> <span id="stage-display">1</span>
        <span id="hard-tag" class="difficulty-badge" style="display:none;">HARD</span>
      </div>
      <div id="timer-box" class="timer-display" style="display:none;">⏳ <span id="timer-count">180</span>s</div>
      <div class="coin-display">🪙 <span id="coin-count">100</span></div>
    </header>

    <div class="shop-container">
      <button class="shop-btn" onclick="undoMove()"><span>↩️ 戻す</span><span>🪙 10</span></button>
      <button class="shop-btn" onclick="showHint()"><span>💡 ヒント</span><span>🪙 20</span></button>
      <button class="shop-btn" onclick="stirBottle()"><span>🥄 かき混ぜ</span><span>🪙 25</span></button>
      <button class="shop-btn" onclick="useShuffle()"><span>🔀 シャッフル</span><span>🪙 50</span></button>
      <button class="shop-btn" onclick="addExtraBottle()"><span>🧪 ボトル追加</span><span>🪙 100</span></button>
    </div>

    <div class="game-board" id="game-board"></div>
  </div>

  <!-- 忍者AdMax 常駐広告 -->
  <div class="fixed-bottom-ad">
    <!-- admax -->
    <script src="https://adm.shinobi.jp/s/5235ee24a3bda74d9a1d05e10baf3d94"></script>
    <!-- admax -->
  </div>

  <script>
    const BOTTLE_CAPACITY = 4;
    const ALL_COLORS = ['light', 'medium', 'dark', 'matcha', 'berry', 'milk'];
    const TOTAL_STAGES = 1500;

    let currentStage = parseInt(localStorage.getItem('roasters_current_stage')) || 1;
    let maxUnlockedStage = parseInt(localStorage.getItem('roasters_max_stage')) || 1;
    let clearedStages = JSON.parse(localStorage.getItem('roasters_cleared_list')) || [];
    let coins = parseInt(localStorage.getItem('roasters_coins')) || 100;
    let claimedAchieves = JSON.parse(localStorage.getItem('roasters_claimed_achieves')) || [];
    let bestTimeAttack = parseInt(localStorage.getItem('roasters_best_ta')) || 0;

    let gameMode = 'normal';
    let timerInterval = null;
    let timeRemaining = 180;
    let taClearedCount = 0;
    let stageStartTime = 0; // ステージ計測タイマー

    let bottles = [];
    let lockedBottles = [];
    let history = [];
    let selectedBottleIndex = null;

    const ACHIEVEMENTS = [
      { id: 'cleared_10', title: 'ビギナーロースター', desc: '10ステージクリア', target: 10, reward: 100 },
      { id: 'cleared_50', title: '一人前マスター', desc: '50ステージクリア', target: 50, reward: 200 },
      { id: 'cleared_100', title: '人気カフェ店主', desc: '100ステージクリア', target: 100, reward: 300 },
      { id: 'cleared_570', title: '伝説の焙煎士', desc: '570ステージ(HARD)達成', target: 570, reward: 500 }
    ];

    function saveState() {
      localStorage.setItem('roasters_current_stage', currentStage);
      localStorage.setItem('roasters_max_stage', maxUnlockedStage);
      localStorage.setItem('roasters_cleared_list', JSON.stringify(clearedStages));
      localStorage.setItem('roasters_coins', coins);
      localStorage.setItem('roasters_claimed_achieves', JSON.stringify(claimedAchieves));
      localStorage.setItem('roasters_best_ta', bestTimeAttack);
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const targetScreen = document.getElementById(screenId);
      if (targetScreen) {
        targetScreen.classList.add('active');
      }
      if (screenId === 'select-screen') renderStageGrid();
      if (screenId === 'achieve-screen') renderAchieveList();
    }

    function continueGame() {
      gameMode = 'normal';
      document.getElementById('timer-box').style.display = 'none';
      document.getElementById('stage-label').innerText = 'STAGE';
      initStage(currentStage);
      showScreen('game-screen');
    }

    function startDailyChallenge() {
      const today = new Date().toDateString();
      if (localStorage.getItem('roasters_last_daily_challenge') === today) {
        return alert("本日の日替わりチャレンジは挑戦済みです！また明日お越しください！");
      }
      gameMode = 'daily';
      document.getElementById('timer-box').style.display = 'none';
      document.getElementById('stage-label').innerText = 'DAILY';
      initStage(9999);
      showScreen('game-screen');
    }

    function startTimeAttack() {
      gameMode = 'timeattack';
      timeRemaining = 180;
      taClearedCount = 0;
      document.getElementById('timer-box').style.display = 'block';
      document.getElementById('timer-count').innerText = timeRemaining;
      document.getElementById('stage-label').innerText = 'TA';
      
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeRemaining--;
        document.getElementById('timer-count').innerText = timeRemaining;
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          alert(`⏰ タイムアップ！\nクリア数: ${taClearedCount} ステージ！`);
          if (taClearedCount > bestTimeAttack) {
            bestTimeAttack = taClearedCount;
            alert(`🎉 ハイスコア更新！ (${bestTimeAttack} ステージ)`);
            saveState();
          }
          showScreen('home-screen');
        }
      }, 1000);

      initStage(100);
      showScreen('game-screen');
    }

    function exitGame() {
      if (timerInterval) clearInterval(timerInterval);
      showScreen('home-screen');
    }

    function updateCoins(amount) {
      coins += amount;
      document.getElementById('coin-count').innerText = coins;
      saveState();
    }

    function claimDailyBonus() {
      const today = new Date().toDateString();
      if (localStorage.getItem('roasters_last_bonus') === today) {
        alert("本日のデイリーボーナスは受取済みです！");
      } else {
        localStorage.setItem('roasters_last_bonus', today);
        updateCoins(100);
        alert("🎁 デイリーボーナス！100コイン獲得！");
      }
    }

    function seededRandom(seed) {
      let x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    function initStage(stageNum) {
      if (gameMode === 'normal') {
        currentStage = stageNum;
        saveState();
      }
      
      selectedBottleIndex = null;
      history = [];
      stageStartTime = Date.now(); // ステージ開始時の時刻をセット

      if (gameMode === 'timeattack') {
        document.getElementById('stage-display').innerText = `(クリア:${taClearedCount})`;
      } else if (gameMode === 'daily') {
        document.getElementById('stage-display').innerText = 'DAY';
      } else {
        document.getElementById('stage-display').innerText = stageNum;
      }

      document.getElementById('coin-count').innerText = coins;

      const isHard = stageNum >= 570 && gameMode === 'normal';
      document.getElementById('hard-tag').style.display = isHard ? 'inline-block' : 'none';

      let numColors = 3;
      if (stageNum > 10) numColors = 4;
      if (stageNum > 50) numColors = 5;
      if (stageNum >= 570) numColors = 6;

      let blindRate = stageNum >= 570 ? 0.45 : (stageNum >= 5 ? 0.2 : 0);
      let frozenRate = stageNum >= 570 ? 0.35 : (stageNum >= 10 ? 0.15 : 0);

      let usedColors = ALL_COLORS.slice(0, numColors);
      let allBeans = [];

      usedColors.forEach(color => {
        for (let i = 0; i < BOTTLE_CAPACITY; i++) {
          allBeans.push({
            color: color,
            isBlind: Math.random() < blindRate,
            isFrozen: Math.random() < frozenRate
          });
        }
      });

      let seed = stageNum * 8888;
      for (let i = allBeans.length - 1; i > 0; i--) {
        const j = Math.floor(seededRandom(seed++) * (i + 1));
        [allBeans[i], allBeans[j]] = [allBeans[j], allBeans[i]];
      }

      bottles = [];
      lockedBottles = [];
      for (let i = 0; i < numColors; i++) {
        bottles.push(allBeans.slice(i * BOTTLE_CAPACITY, (i + 1) * BOTTLE_CAPACITY));
        lockedBottles.push(false);
      }
      
      let emptyCount = stageNum >= 570 ? 1 : 2;
      for (let e = 0; e < emptyCount; e++) {
        bottles.push([]);
        lockedBottles.push(false);
      }

      bottles.forEach(b => {
        if (b.length > 0) b[b.length - 1].isBlind = false;
      });

      renderBoard();
    }

    function renderBoard() {
      const board = document.getElementById('game-board');
      if (!board) return;
      board.innerHTML = '';

      bottles.forEach((bottle, bIndex) => {
        const bottleEl = document.createElement('div');
        let isLocked = lockedBottles[bIndex];
        bottleEl.className = `bottle ${selectedBottleIndex === bIndex ? 'selected' : ''} ${isLocked ? 'locked-bottle' : ''}`;
        bottleEl.onclick = () => handleBottleClick(bIndex);

        if (!isLocked) {
          bottle.forEach(bean => {
            const beanEl = document.createElement('div');
            let extraClass = '';
            if (bean.isBlind) extraClass += ' blind';
            if (bean.isFrozen) extraClass += ' frozen';
            beanEl.className = `bean bean-${bean.color} ${extraClass}`;
            bottleEl.appendChild(beanEl);
          });
        }

        board.appendChild(bottleEl);
      });
    }

    function handleBottleClick(index) {
      if (selectedBottleIndex === null) {
        if (bottles[index].length > 0) {
          let topBean = bottles[index][bottles[index].length - 1];
          if (topBean.isFrozen) {
            topBean.isFrozen = false;
            alert("❄️ 氷を割りました！");
            renderBoard();
            return;
          }
          selectedBottleIndex = index;
        }
      } else {
        if (selectedBottleIndex === index) {
          selectedBottleIndex = null;
        } else {
          moveBean(selectedBottleIndex, index);
          selectedBottleIndex = null;
        }
      }
      renderBoard();
    }

    function moveBean(fromIndex, toIndex) {
      const fromBottle = bottles[fromIndex];
      const toBottle = bottles[toIndex];

      if (fromBottle.length === 0 || toBottle.length >= BOTTLE_CAPACITY) return;

      const movingBean = fromBottle[fromBottle.length - 1];
      const targetTopBean = toBottle[toBottle.length - 1];

      if (toBottle.length === 0 || targetTopBean.color === movingBean.color) {
        history.push(JSON.stringify({ bottles: bottles, locked: lockedBottles }));
        movingBean.isBlind = false;
        toBottle.push(fromBottle.pop());

        if (fromBottle.length > 0) {
          fromBottle[fromBottle.length - 1].isBlind = false;
        }

        checkWin();
      }
    }

    function undoMove() {
      if (history.length === 0) return alert("戻せる手がありません！");
      if (coins >= 10) {
        updateCoins(-10);
        let lastState = JSON.parse(history.pop());
        bottles = lastState.bottles;
        lockedBottles = lastState.locked;
        renderBoard();
      } else {
        alert("コインが足りません！");
      }
    }

    function stirBottle() {
      if (selectedBottleIndex === null) return alert("ボトルを先に選択してください！");
      if (coins >= 25) {
        updateCoins(-25);
        bottles[selectedBottleIndex].sort(() => Math.random() - 0.5);
        selectedBottleIndex = null;
        renderBoard();
      } else {
        alert("コインが足りません！");
      }
    }

    function showHint() {
      if (coins < 20) return alert("コインが足りません！");
      for (let i = 0; i < bottles.length; i++) {
        for (let j = 0; j < bottles.length; j++) {
          if (i !== j && bottles[i].length > 0 && bottles[j].length < BOTTLE_CAPACITY) {
            let srcBean = bottles[i][bottles[i].length - 1];
            let destBean = bottles[j][bottles[j].length - 1];
            if (!srcBean.isFrozen && (bottles[j].length === 0 || srcBean.color === destBean.color)) {
              updateCoins(-20);
              selectedBottleIndex = i;
              renderBoard();
              alert(`💡 ヒント: ${i + 1}番目から${j + 1}番目のボトルへ！`);
              return;
            }
          }
        }
      }
      alert("移動できる場所がありません！");
    }

    function useShuffle() {
      if (coins >= 50) {
        updateCoins(-50);
        let allBeans = bottles.flat();
        allBeans.sort(() => Math.random() - 0.5);
        bottles = bottles.map(() => []);
        allBeans.forEach((bean, idx) => {
          bottles[idx % (bottles.length - 1)].push(bean);
        });
        renderBoard();
      } else {
        alert("コインが足りません！");
      }
    }

    function addExtraBottle() {
      if (coins >= 100) {
        updateCoins(-100);
        bottles.push([]);
        lockedBottles.push(false);
        renderBoard();
      } else {
        alert("コインが足りません！");
      }
    }

    function checkWin() {
      setTimeout(() => {
        const isWin = bottles.every(b => b.length === 0 || (b.length === BOTTLE_CAPACITY && b.every(v => v.color === b[0].color && !v.isFrozen)));
        if (isWin) {
          // 所要時間の計算（秒）
          const clearTimeSec = ((Date.now() - stageStartTime) / 1000).toFixed(1);

          if (gameMode === 'daily') {
            const today = new Date().toDateString();
            localStorage.setItem('roasters_last_daily_challenge', today);
            alert(`🎉 日替わりチャレンジクリア！\n⏱️ タイム: ${clearTimeSec}秒\n🪙 +150獲得！`);
            updateCoins(150);
            showScreen('home-screen');
          } else if (gameMode === 'timeattack') {
            taClearedCount++;
            initStage(100 + taClearedCount);
          } else {
            alert(`🎉 Stage ${currentStage} クリア！\n⏱️ タイム: ${clearTimeSec}秒\n🪙 +50獲得！`);
            if (!clearedStages.includes(currentStage)) {
              clearedStages.push(currentStage);
            }
            if (currentStage >= maxUnlockedStage && currentStage < TOTAL_STAGES) {
              maxUnlockedStage = currentStage + 1;
            }
            currentStage = currentStage + 1;
            updateCoins(50);
            initStage(currentStage);
          }
        }
      }, 100);
    }

    function renderStageGrid() {
      const grid = document.getElementById('stage-grid');
      if (!grid) return;
      grid.innerHTML = '';
      const fragment = document.createDocumentFragment();
      for (let i = 1; i <= TOTAL_STAGES; i++) {
        const card = document.createElement('div');
        let isLocked = i > maxUnlockedStage;
        let isCleared = clearedStages.includes(i);
        let isHard = i >= 570;

        let classNames = ['stage-card'];
        if (isLocked) classNames.push('locked');
        if (isCleared) classNames.push('cleared');
        if (isHard) classNames.push('hard');

        card.className = classNames.join(' ');
        card.innerText = isLocked ? '🔒' : i;

        if (!isLocked) {
          card.onclick = () => {
            gameMode = 'normal';
            document.getElementById('timer-box').style.display = 'none';
            document.getElementById('stage-label').innerText = 'STAGE';
            initStage(i);
            showScreen('game-screen');
          };
        }
        fragment.appendChild(card);
      }
      grid.appendChild(fragment);
    }

    function renderAchieveList() {
      const list = document.getElementById('achieve-list');
      if (!list) return;
      list.innerHTML = '';
      ACHIEVEMENTS.forEach(ach => {
        const item = document.className = 'achieve-item';
        
        let isAchieved = clearedStages.length >= ach.target;
        let isClaimed = claimedAchieves.includes(ach.id);

        item.innerHTML = `
          <div>
            <div style="font-weight:bold; font-size:0.95rem;">${ach.title}</div>
            <div style="font-size:0.75rem; color:#666;">${ach.desc} (報酬: 🪙${ach.reward})</div>
          </div>
          <button class="achieve-claim-btn ${isClaimed ? 'done' : ''}" ${!isAchieved || isClaimed ? 'disabled' : ''} onclick="claimAchieve('${ach.id}', ${ach.reward})">
            ${isClaimed ? '受取済' : (isAchieved ? '受け取る' : '未達成')}
          </button>
        `;
        list.appendChild(item);
      });
    }

    function claimAchieve(id, reward) {
      if (!claimedAchieves.includes(id)) {
        claimedAchieves.push(id);
        updateCoins(reward);
        alert(`🎁 実績達成！ 🪙${reward} コインを獲得しました！`);
        renderAchieveList();
      }
    }

    // 初期化表示
    window.onload = function() {
      showScreen('home-screen');
    };
  </script>
</body>
</html>
