<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Roasters Sort - レトロカフェ パズル</title>
  <style>
    :root {
      --bg-color: #f7f0e6;
      --card-bg: #fff8f0;
      --primary-color: #4a2c11;
      --accent-color: #e06d28;
      --text-color: #2b1810;
      --ad-height: 60px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: var(--ad-height);
      overflow-x: hidden;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 480px;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .screen.active {
      display: flex;
    }

    /* --- 1. ホーム画面 --- */
    #home-screen {
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .title-logo {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--primary-color);
      margin-bottom: 5px;
      text-shadow: 3px 3px 0px #e06d28;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 1rem;
      color: #666;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .home-btn {
      width: 85%;
      max-width: 300px;
      padding: 16px;
      margin: 8px 0;
      font-size: 1.15rem;
      font-weight: bold;
      border: 3px solid var(--primary-color);
      border-radius: 30px;
      background: var(--accent-color);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--primary-color);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .home-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--primary-color);
    }

    .home-btn.secondary {
      background: #fff;
      color: var(--primary-color);
    }

    .home-btn.bonus {
      background: #27ae60;
    }

    /* --- 2. ステージ選択画面 --- */
    #select-screen {
      padding: 15px;
    }

    .screen-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      margin-bottom: 15px;
      border-bottom: 2px solid var(--primary-color);
    }

    .back-btn {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.2);
    }

    .stage-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      overflow-y: auto;
      max-height: 70vh;
      padding: 5px;
    }

    .stage-card {
      aspect-ratio: 1;
      background: #fff;
      border: 2px solid var(--primary-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--primary-color);
      position: relative;
    }

    .stage-card.locked {
      background: #dcdde1;
      border-color: #7f8c8d;
      color: #7f8c8d;
      box-shadow: none;
      cursor: not-allowed;
    }

    .stage-card.cleared::after {
      content: '⭐⭐⭐';
      font-size: 0.55rem;
      margin-top: 2px;
    }

    /* --- 3. パズルゲーム画面 --- */
    header {
      width: 100%;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #5c3a21, #3d2314);
      color: #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    .coin-display {
      background: #e06d28;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2);
    }

    .game-board {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin: 20px 0;
      min-height: 230px;
    }

    .bottle {
      width: 54px;
      height: 175px;
      border: 3px solid #5c3a21;
      border-radius: 0 0 18px 18px;
      background: rgba(255,255,255,0.85);
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      padding: 4px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
    }

    .bottle.selected {
      transform: translateY(-16px);
      border-color: #e06d28;
      box-shadow: 0 8px 20px rgba(224, 109, 40, 0.4);
    }

    .bean {
      width: 100%;
      height: 38px;
      border-radius: 10px;
      margin-top: 2px;
      transition: all 0.2s ease;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -3px 4px rgba(0,0,0,0.3);
    }

    .bean-light  { background: linear-gradient(135deg, #e6b88a, #c48b52); }
    .bean-medium { background: linear-gradient(135deg, #b87333, #8a4f1d); }
    .bean-dark   { background: linear-gradient(135deg, #5a3825, #2b1810); }
    .bean-matcha { background: linear-gradient(135deg, #8ba832, #556b14); }
    .bean-berry  { background: linear-gradient(135deg, #d9534f, #962d2a); }
    .bean-milk   { background: linear-gradient(135deg, #f5ebe0, #d5bdaf); }

    .shop-container {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 10px 0;
    }

    .shop-btn {
      background: #fff;
      border: 2px solid #5c3a21;
      border-radius: 10px;
      padding: 8px 2px;
      font-size: 0.72rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      box-shadow: 0 3px 0 #5c3a21;
    }

    .shop-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #5c3a21;
    }

    /* 広告枠 */
    .fixed-bottom-ad {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      height: var(--ad-height);
      background-color: #f0f0f0;
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
      border-top: 1px solid #ccc;
    }

    /* 紙吹雪アニメーション */
    .confetti {
      position: fixed;
      width: 10px; height: 10px;
      z-index: 10001;
      pointer-events: none;
      animation: fall 2.5s linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- 1. ホーム画面 -->
  <div id="home-screen" class="screen active">
    <div class="title-logo">☕ Roasters Sort</div>
    <div class="subtitle">〜本格自家焙煎パズル〜</div>
    
    <button class="home-btn" onclick="continueGame()">▶ 続きから遊ぶ</button>
    <button class="home-btn secondary" onclick="showScreen('select-screen')">🗺️ ステージ選択 (1-500)</button>
    <button class="home-btn bonus" onclick="claimDailyBonus()">🎁 デイリーボーナス</button>
  </div>

  <!-- 2. ステージ選択画面 -->
  <div id="select-screen" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="showScreen('home-screen')">🏠 ホーム</button>
      <h2 style="font-size: 1.1rem;">ステージ選択</h2>
      <div style="width: 50px;"></div>
    </div>
    <div class="stage-grid" id="stage-grid"></div>
  </div>

  <!-- 3. パズルゲーム画面 -->
  <div id="game-screen" class="screen">
    <header>
      <button class="back-btn" onclick="showScreen('select-screen')">🗺️ 一覧</button>
      <div style="font-weight:bold;">STAGE <span id="stage-display">1</span></div>
      <div class="coin-display">🪙 <span id="coin-count">100</span></div>
    </header>

    <div class="game-board" id="game-board"></div>

    <div class="shop-container">
      <button class="shop-btn" onclick="undoMove()"><span>↩️ 1手戻す</span><span>🪙 10</span></button>
      <button class="shop-btn" onclick="showHint()"><span>💡 ヒント</span><span>🪙 20</span></button>
      <button class="shop-btn" onclick="useShuffle()"><span>🔀 シャッフル</span><span>🪙 50</span></button>
      <button class="shop-btn" onclick="addExtraBottle()"><span>🧪 ボトル追加</span><span>🪙 100</span></button>
    </div>
  </div>

  <!-- 忍者AdMax 常駐広告 -->
  <div class="fixed-bottom-ad">
    <!-- admax -->
    <script src="https://adm.shinobi.jp/s/5235ee24a3bda74d9a1d05e10baf3d94"></script>
    <!-- admax -->
  </div>

  <script>
    const BOTTLE_CAPACITY = 4;
    const ALL_COLORS = ['light', 'medium', 'dark', 'matcha', 'berry', 'milk'];

    let currentStage = parseInt(localStorage.getItem('roasters_current_stage')) || 1;
    let maxUnlockedStage = parseInt(localStorage.getItem('roasters_max_stage')) || 1;
    let coins = parseInt(localStorage.getItem('roasters_coins')) || 100;

    let bottles = [];
    let history = [];
    let selectedBottleIndex = null;

    // 簡易効果音（Web Audio API）
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'tap') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'win') {
        osc.frequency.setValueAtTime(523, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      if (screenId === 'select-screen') renderStageGrid();
    }

    function continueGame() {
      initStage(currentStage);
      showScreen('game-screen');
    }

    function updateCoins(amount) {
      coins += amount;
      document.getElementById('coin-count').innerText = coins;
      localStorage.setItem('roasters_coins', coins);
    }

    function claimDailyBonus() {
      const today = new Date().toDateString();
      const lastClaim = localStorage.getItem('roasters_last_bonus');
      if (lastClaim === today) {
        alert("本日のデイリーボーナスは受取済みです！また明日お越しください！");
      } else {
        localStorage.setItem('roasters_last_bonus', today);
        updateCoins(100);
        alert("🎁 デイリーボーナス！100コインを獲得しました！");
      }
    }

    function seededRandom(seed) {
      let x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    function initStage(stageNum) {
      currentStage = stageNum;
      selectedBottleIndex = null;
      history = [];
      document.getElementById('stage-display').innerText = stageNum;
      document.getElementById('coin-count').innerText = coins;
      localStorage.setItem('roasters_current_stage', currentStage);

      let numColors = 3;
      if (stageNum > 10) numColors = 4;
      if (stageNum > 50) numColors = 5;
      if (stageNum > 150) numColors = 6;

      let usedColors = ALL_COLORS.slice(0, numColors);
      let allBeans = [];
      usedColors.forEach(color => {
        for (let i = 0; i < BOTTLE_CAPACITY; i++) allBeans.push(color);
      });

      let seed = stageNum * 8888;
      for (let i = allBeans.length - 1; i > 0; i--) {
        const j = Math.floor(seededRandom(seed++) * (i + 1));
        [allBeans[i], allBeans[j]] = [allBeans[j], allBeans[i]];
      }

      bottles = [];
      for (let i = 0; i < numColors; i++) {
        bottles.push(allBeans.slice(i * BOTTLE_CAPACITY, (i + 1) * BOTTLE_CAPACITY));
      }
      bottles.push([]);
      bottles.push([]);

      renderBoard();
    }

    function renderBoard() {
      const board = document.getElementById('game-board');
      board.innerHTML = '';

      bottles.forEach((bottle, bIndex) => {
        const bottleEl = document.createElement('div');
        bottleEl.className = `bottle ${selectedBottleIndex === bIndex ? 'selected' : ''}`;
        bottleEl.onclick = () => handleBottleClick(bIndex);

        bottle.forEach(colorClass => {
          const beanEl = document.createElement('div');
          beanEl.className = `bean bean-${colorClass}`;
          bottleEl.appendChild(beanEl);
        });

        board.appendChild(bottleEl);
      });
    }

    function handleBottleClick(index) {
      playSound('tap');
      if (selectedBottleIndex === null) {
        if (bottles[index].length > 0) selectedBottleIndex = index;
      } else {
        if (selectedBottleIndex === index) {
          selectedBottleIndex = null;
        } else {
          moveBean(selectedBottleIndex, index);
          selectedBottleIndex = null;
        }
      }
      renderBoard();
    }

    function moveBean(fromIndex, toIndex) {
      const fromBottle = bottles[fromIndex];
      const toBottle = bottles[toIndex];

      if (fromBottle.length === 0 || toBottle.length >= BOTTLE_CAPACITY) return;

      const movingBean = fromBottle[fromBottle.length - 1];
      const targetTopBean = toBottle[toBottle.length - 1];

      if (toBottle.length === 0 || targetTopBean === movingBean) {
        history.push(JSON.stringify(bottles));
        toBottle.push(fromBottle.pop());
        checkWin();
      }
    }

    function undoMove() {
      if (history.length === 0) return alert("戻せる手がありません！");
      if (coins >= 10) {
        updateCoins(-10);
        bottles = JSON.parse(history.pop());
        renderBoard();
      } else {
        alert("コインが足りません！");
      }
    }

    function showHint() {
      if (coins < 20) return alert("コインが足りません！");
      for (let i = 0; i < bottles.length; i++) {
        for (let j = 0; j < bottles.length; j++) {
          if (i !== j && bottles[i].length > 0 && bottles[j].length < BOTTLE_CAPACITY) {
            let srcBean = bottles[i][bottles[i].length - 1];
            let destBean = bottles[j][bottles[j].length - 1];
            if (bottles[j].length === 0 || srcBean === destBean) {
              updateCoins(-20);
              selectedBottleIndex = i;
              renderBoard();
              alert(`💡 ヒント: ${i + 1}番目から${j + 1}番目のボトルへ動かせます！`);
              return;
            }
          }
        }
      }
      alert("移動できる場所がありません！");
    }

    function useShuffle() {
      if (coins >= 50) {
        updateCoins(-50);
        let allBeans = bottles.flat().sort(() => Math.random() - 0.5);
        bottles = bottles.map(() => []);
        allBeans.forEach((bean, idx) => {
          bottles[idx % (bottles.length - 2)].push(bean);
        });
        renderBoard();
      } else {
        alert("コインが足りません！");
      }
    }

    function addExtraBottle() {
      if (coins >= 100) {
        updateCoins(-100);
        bottles.push([]);
        renderBoard();
      } else {
        alert("コインが足りません！");
      }
    }

    function checkWin() {
      setTimeout(() => {
        const isWin = bottles.every(b => b.length === 0 || (b.length === BOTTLE_CAPACITY && b.every(v => v === b[0])));
        if (isWin) {
          playSound('win');
          triggerConfetti();
          alert(`🎉 Stage ${currentStage} クリア！ 🪙+50獲得！`);
          updateCoins(50);
          if (currentStage >= maxUnlockedStage) {
            maxUnlockedStage = currentStage + 1;
            localStorage.setItem('roasters_max_stage', maxUnlockedStage);
          }
          initStage(currentStage + 1);
        }
      }, 100);
    }

    function triggerConfetti() {
      for (let i = 0; i < 30; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = ['#e06d28', '#27ae60', '#f1c40f', '#e74c3c', '#9b59b6'][Math.floor(Math.random() * 5)];
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 2500);
      }
    }

    function renderStageGrid() {
      const grid = document.getElementById('stage-grid');
      grid.innerHTML = '';
      for (let i = 1; i <= 500; i++) {
        const card = document.createElement('div');
        let isLocked = i > maxUnlockedStage;
        card.className = `stage-card ${isLocked ? 'locked' : ''} ${i < maxUnlockedStage ? 'cleared' : ''}`;
        card.innerText = isLocked ? '🔒' : i;
        if (!isLocked) {
          card.onclick = () => {
            initStage(i);
            showScreen('game-screen');
          };
        }
        grid.appendChild(card);
      }
    }
  </script>
</body>
</html>
