<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Roasters Sort - 1500 Stages & Challenge</title>
  <style>
    :root {
      --bg-color: #f7f0e6;
      --card-bg: #fff8f0;
      --primary-color: #4a2c11;
      --accent-color: #e06d28;
      --text-color: #2b1810;
      --ad-height: 60px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 480px;
      height: calc(100vh - var(--ad-height));
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .screen.active {
      display: flex;
    }

    /* --- 1. ホーム画面 --- */
    #home-screen {
      justify-content: flex-start;
      padding: 20px 15px 30px 15px;
      text-align: center;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .title-logo {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--primary-color);
      margin-top: 10px;
      margin-bottom: 5px;
      text-shadow: 2px 2px 0px #e06d28;
      flex-shrink: 0;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 20px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .home-btn {
      width: 85%;
      max-width: 300px;
      padding: 14px;
      margin: 6px 0;
      font-size: 1.05rem;
      font-weight: bold;
      border: 3px solid var(--primary-color);
      border-radius: 30px;
      background: var(--accent-color);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--primary-color);
      transition: transform 0.1s;
      flex-shrink: 0;
    }

    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--primary-color);
    }

    .home-btn.secondary { background: #fff; color: var(--primary-color); }
    .home-btn.bonus { background: #27ae60; }
    .home-btn.timeattack { background: #d35400; }

    /* --- 2. ステージ選択画面 --- */
    #select-screen, #achieve-screen {
      padding: 15px 15px 10px 15px;
      height: calc(100vh - var(--ad-height));
    }

    .screen-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      margin-bottom: 10px;
      border-bottom: 2px solid var(--primary-color);
      flex-shrink: 0;
    }

    .back-btn {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .stage-grid-container {
      width: 100%;
      flex: 1;
      height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 20px;
    }

    .stage-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 5px;
    }

    .stage-card {
      aspect-ratio: 1;
      background: #fff;
      border: 2px solid var(--primary-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--primary-color);
      position: relative;
    }

    .stage-card.cleared::after {
      content: '✓';
      position: absolute;
      top: 2px;
      right: 6px;
      color: #27ae60;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .stage-card.hard {
      border-color: #c0392b;
      color: #c0392b;
      background: #fff0f0;
    }

    .stage-card.locked {
      background: #dcdde1;
      border-color: #7f8c8d;
      color: #7f8c8d;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* --- アチーブメントリスト --- */
    .achieve-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }

    .achieve-item {
      background: #fff;
      border: 2px solid var(--primary-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .achieve-claim-btn {
      background: #27ae60;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .achieve-claim-btn.done {
      background: #7f8c8d;
      cursor: default;
    }
